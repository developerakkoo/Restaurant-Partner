<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title class="ion-text-center">Orders</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-segment value="0" (ionChange)="segmentChanged($event)" mode="ios">
    <ion-segment-button value="0">
      <ion-label>Received</ion-label>
    </ion-segment-button>
    <ion-segment-button value="3">
      <ion-label>Arriving</ion-label>
    </ion-segment-button>
    <ion-segment-button value="7">
      <ion-label>Completed Order</ion-label>
    </ion-segment-button>
  </ion-segment>

  <ion-text color="primary" class="ion-text-center" *ngIf="orders.length == 0">
    <h1>No Orders!</h1>
  </ion-text>

  <ion-list *ngIf="orders.length > 0">
    <ion-list-header>
      <ion-label>All Orders here</ion-label>
    </ion-list-header>

    <ion-card
      *ngFor="let item of orders"
      (click)="presentActionSheet(item._id)"
    >
      <ion-card-header>
        <ion-card-subtitle
          >Order By:- {{item.userId.phoneNumber}}</ion-card-subtitle
        >
        <ion-card-title> Order ID: {{item.orderId}}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item *ngFor="let p of item.items">
          <ion-avatar slot="start">
            <img crossorigin="anonymous" [src]="p.serviceId.image_url" />
          </ion-avatar>
          <ion-label
            >{{p.serviceId.name}}

            <p>{{p.serviceId.perKgPrice | currency:"INR"}}</p>
          </ion-label>
        </ion-item>
        <ion-button
          *ngIf="item.status == 0"
          (click)="orderChangeStatus(item._id,1)"
          expand="block"
          fill="solid"
          shape="round"
        >
          Accept
        </ion-button>
        <ion-button
          *ngIf="item.status == 3"
          (click)="orderChangeStatus(item._id,4)"
          expand="block"
          fill="solid"
          shape="round"
        >
          Confirm Order Received
        </ion-button>

        <ion-button
          *ngIf="item.status == 4"
          (click)="orderChangeStatus(item._id,5)"
          expand="block"
          fill="solid"
          shape="round"
        >
          Confirm Order is Ready
        </ion-button>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
